<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小雞考試樂園</title>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6cf;--sf:#fffdf0;--ink:#5a3e2b;--mut:#7a5f49;--ln:#f3dd99;--bd:#d9b46a;--ac:#bf5518;--acfg:#fff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) radial-gradient(circle,#ffe58a 2px,transparent 2.5px) 0 0/30px 30px;color:var(--ink);font:16px/1.5 "Chiron GoRound TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
#app{max-width:1400px;margin:0 auto;padding:14px 18px;display:flex;flex-direction:column;gap:14px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:clamp(24px,4vw,44px);background:linear-gradient(transparent 62%,#ffe27a 62%)}
.clk{text-align:center}
#dt{font-size:clamp(14px,2vw,24px);color:var(--mut)}
#tm{font-size:clamp(44px,9vw,110px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:22px;flex:1}
@media (max-width:800px){.grid{grid-template-columns:1fr}}
.card{position:relative;background:var(--sf);border:3px solid var(--bd);border-radius:26px;box-shadow:0 5px 0 var(--bd);padding:28px 18px 16px;transition:background .3s}
.card.warn{background:#fff0c9}.card.bad{background:#ffe1dc}.card.ok{background:#e4f6e6}
.tag{position:absolute;top:-16px;left:20px;padding:1px 16px;border-radius:99px;border:2px solid var(--bd);font-size:15px;font-weight:500}
.pk{background:#ffc8d6}.gn{background:#bfe6cf}
.nm{font-size:clamp(40px,8vw,96px);line-height:1.15}
.pill{display:inline-block;margin-left:14px;vertical-align:middle;font-size:clamp(18px,3vw,36px);font-weight:500;background:#dff0fb;border:2px solid #9cc7e6;border-radius:14px;padding:0 16px}
.cd{display:flex;align-items:baseline;gap:6px 14px;flex-wrap:wrap;margin:10px 0 4px}
.cd>span:first-child{font-size:clamp(16px,2.6vw,30px)}
.big{font-size:clamp(40px,7vw,84px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.adj{display:flex;gap:6px}
button{font:inherit;color:inherit}
.b{font-weight:500;padding:7px 16px;border-radius:99px;border:2px solid var(--ac);background:var(--ac);color:var(--acfg);cursor:pointer}
.b.g,.b.s{background:var(--sf);color:var(--ac)}
.b.s{padding:2px 12px;font-size:14px}
.b.d{background:var(--sf);color:#b3372f;border-color:#e3b3ae}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tl{--cw:clamp(44px,6vw,80px);position:relative;height:clamp(110px,15vw,170px);margin:6px 8px 0}
.gr{position:absolute;left:0;right:0;bottom:24px;height:14px;background:#bfe3a5;border:2px solid #9ccb85;border-radius:99px}
.mk{position:absolute;bottom:0;left:calc((100% - var(--cw))*var(--q) + var(--cw)/2);transform:translateX(-50%);text-align:center;line-height:1}
.mk span{display:block;font-size:clamp(22px,3vw,38px);margin-bottom:3px}
.mk small{font-size:clamp(12px,1.5vw,18px);color:var(--mut);white-space:nowrap}
.chick{position:absolute;bottom:30px;width:var(--cw);height:var(--cw);left:calc((100% - var(--cw))*var(--p,0));transition:left .5s linear;overflow:visible}
.leg{transform-box:fill-box;transform-origin:50% 0;animation:step .45s ease-in-out infinite alternate;animation-play-state:paused}
.leg.b{animation-direction:alternate-reverse}
.walk .leg{animation-play-state:running}
.walk .bob{animation:bob .45s ease-in-out infinite}
.tl.done .chick{animation:hop .6s ease-in-out infinite}
@keyframes step{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.walk .seg{animation:wave .5s ease-in-out infinite}
@keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.pets{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.pt{display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid var(--ln);border-radius:14px;background:var(--bg);padding:6px;cursor:pointer;font-size:14px}
.pt[aria-pressed=true]{border-color:var(--ac);background:#fff0c0;outline:2px solid var(--ac)}
@media (prefers-reduced-motion:reduce){.leg,.bob,.seg,.chick{animation:none!important;transition:none}}
.tm{display:flex;justify-content:space-between;color:var(--mut);font-size:clamp(14px,1.8vw,22px);margin:0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 12px}
.stat{border-radius:18px;border:2px solid;padding:6px;text-align:center}
.stat small{display:block;font-size:clamp(14px,2vw,22px)}
.stat b{font-size:clamp(36px,6vw,76px);line-height:1.1}
.stat i{font-size:.3em;font-style:normal}
.bl{background:#dff0fb;border-color:#9cc7e6}.gr2{background:#dcf3e4;border-color:#9fd3b0}
.ab{background:#ffe3e8;border:2px solid #f0aebd;border-radius:18px;padding:10px 14px;min-height:110px;margin-bottom:12px;font-size:clamp(18px,2.6vw,30px)}
.ab small{display:block;font-size:15px;color:var(--mut)}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.seat{font-weight:500;padding:6px 0;border-radius:10px;border:2px solid var(--ln);background:var(--sf);cursor:pointer}
.seat.a{background:#f4a9a3;border-color:#d97c75}.seat.l{background:#c5d4e8;border-color:#8fa9cc}.seat.t{background:#ffd08a;border-color:#e0a44a}
.mut{color:var(--mut);font-size:14px;margin:6px 0 0}
#chips{display:flex;gap:12px;overflow-x:auto;padding:6px 3px 8px}
.chip{flex:0 0 auto;min-width:210px;text-align:left;border:2px solid var(--bd);border-radius:18px;background:var(--sf);padding:6px 14px;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:0 12px}
.chip b{font-size:clamp(18px,2.4vw,28px)}
.chip span{grid-row:2;color:var(--mut);font-size:14px}
.chip em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:13px;padding:1px 10px;border-radius:99px;border:2px solid var(--ln)}
.chip.foc{outline:3px solid var(--ac);outline-offset:2px}
.chip.nx{background:#fff0c0}.chip.nx em{background:#ffc8d6;border-color:#f0aebd}
.chip.rn{background:#e4f6e6}.chip.rn em{background:#bfe6cf;border-color:#9fd3b0}
.chip.en{opacity:.6}
#msg{text-align:center;font-size:clamp(16px,2.4vw,28px);margin:0;font-weight:500}
footer{display:flex;gap:10px;flex-wrap:wrap}
#set{position:fixed;inset:0;background:rgba(90,62,43,.4);display:flex;justify-content:flex-end;z-index:20}
#set[hidden]{display:none}
#pn{background:var(--sf);width:min(520px,100%);overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.sh{display:flex;justify-content:space-between;align-items:center}
h2,h3{margin:8px 0}
h3{font-size:16px;margin-top:18px}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:2px;margin-bottom:8px;flex:1 1 110px}
label.ck{flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--ink)}
input{font:inherit;padding:7px 10px;border:2px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.ck input{width:auto}
.row{display:flex;flex-wrap:wrap;gap:8px}
.xr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.xr input{flex:1 1 90px}
.err{color:#b3372f;min-height:1.4em;margin:4px 0}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span aria-hidden="true">📋 </span><span id="h1"></span></h1>
    <div class="clk"><div id="dt"></div><div id="tm"></div></div>
  </header>
  <section class="grid">
    <div class="card" id="main"></div>
    <div class="card" id="att"></div>
  </section>
  <div id="chips"></div>
  <p id="msg"></p>
  <footer>
    <button class="b g" data-a="set">⚙️ 設定</button>
    <button class="b g" data-a="test">🔔 測試叮咚聲</button>
    <button class="b g" data-a="fs">⛶ 全螢幕</button>
  </footer>
</div>
<div id="set" hidden><div id="pn"></div></div>
<script>
var KEY="exam-board-v1",$=function(i){return document.getElementById(i)};
function pad(n){return String(n).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,8)}
function today(){var d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function hm(t){var d=new Date(t);return pad(d.getHours())+":"+pad(d.getMinutes())}
var S={title:"期中定期評量",n:23,msg:"寫完記得檢查姓名與座號喔",snd:true,exams:[],att:{},pin:null},loaded=false;
try{var raw=localStorage.getItem(KEY);if(raw){Object.assign(S,JSON.parse(raw));loaded=true}}catch(e){}
if(!loaded)S.exams=[{id:uid(),name:"社會",date:today(),start:"08:40",end:"09:20",ext:0},{id:uid(),name:"數學",date:today(),start:"09:30",end:"10:10",ext:0}];
var roll=false,prev={},lastSig="",AC;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ms(e,k){var t=new Date((e.date||today())+"T"+((k==="s"?e.start:e.end)||"00:00")+":00").getTime();return k==="s"?t:t+(e.ext||0)*6e4}
function st(e,n){return n<ms(e,"s")?"pre":n<ms(e,"e")?"run":"end"}
function list(){return S.exams.slice().sort(function(a,b){return ms(a,"s")-ms(b,"s")})}
function focus(n,L){var p=S.pin&&L.find(function(e){return e.id===S.pin});return p||L.find(function(e){return st(e,n)==="run"})||L.find(function(e){return st(e,n)==="pre"})||L[L.length-1]||null}
function cd(x){var s=Math.max(0,Math.ceil(x/1000)),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+" 天 ":"")+(d||h?pad(h)+":":"")+pad(m)+":"+pad(s%60)}
function ding(t){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();var n=AC.currentTime;t.forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain(),a=n+i*.55;o.frequency.value=f;g.gain.setValueAtTime(.0001,a);g.gain.exponentialRampToValueAtTime(.4,a+.03);g.gain.exponentialRampToValueAtTime(.0001,a+1.2);o.connect(g);g.connect(AC.destination);o.start(a);o.stop(a+1.3)})}catch(e){}}
function marks(id){var A=S.att[id]||{},o={"缺席":[],"請假":[],"遲到":[]};for(var i=1;i<=S.n;i++)if(o[A[i]])o[A[i]].push(i);return o}
var LEG='stroke="#ff9a3c" stroke-width="2.5" stroke-linecap="round" fill="none"';
var CHICK='<svg class="chick" viewBox="0 0 44 44" aria-hidden="true"><g class="leg"><path d="M18 35v7m0 0h-3m3 0h3" '+LEG+'/></g><g class="leg b"><path d="M27 35v7m0 0h-3m3 0h3" '+LEG+'/></g><g class="bob"><ellipse cx="22" cy="23" rx="15" ry="13" fill="#ffd84a"/><path d="M20 11q2-6 5-1M24 10q3-5 5 1" stroke="#ffc72c" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="15" cy="26" rx="6" ry="4" fill="#ffc72c" transform="rotate(-15 15 26)"/><circle cx="29" cy="19" r="2.2" fill="#5a3e2b"/><circle cx="29.8" cy="18.3" r=".7" fill="#fff"/><circle cx="32" cy="25" r="2.6" fill="#ffa8a0" opacity=".8"/><path d="M34 21l8 3-8 3z" fill="#ff9a3c"/></g></svg>';

function legs(c,a,b){var p='stroke="'+c+'" stroke-width="4" stroke-linecap="round" fill="none"';return '<g class="leg"><path d="M'+a+' 34v7" '+p+'/></g><g class="leg b"><path d="M'+b+' 34v7" '+p+'/></g>'}
var PETS={
chick:{n:"小雞",s:CHICK.replace(/^<svg[^>]*>/,"").replace("</svg>","")},
snail:{n:"蝸牛",s:'<g class="bob"><ellipse cx="22" cy="38" rx="19" ry="4.5" fill="#f3cfa6"/><circle cx="37" cy="33" r="5" fill="#f3cfa6"/><path d="M36 29l-2-9M40 29l3-8" stroke="#e5b988" stroke-width="2" stroke-linecap="round"/><circle cx="34" cy="19.5" r="2.2" fill="#5a3e2b"/><circle cx="43" cy="20.5" r="2.2" fill="#5a3e2b"/><circle cx="19" cy="26" r="12" fill="#f6b26b"/><circle cx="19" cy="26" r="8" fill="none" stroke="#d98b3a" stroke-width="2"/><circle cx="19" cy="26" r="4" fill="none" stroke="#d98b3a" stroke-width="2"/><circle cx="38.5" cy="35" r="1.5" fill="#ffa8a0"/></g>'},
worm:{n:"毛毛蟲",s:[7,15,23,30].map(function(x,i){return '<g class="seg" style="animation-delay:-'+(.4-i*.1).toFixed(1)+'s"><circle cx="'+x+'" cy="36" r="6" fill="#8fd16a" stroke="#6fb24c"/></g>'}).join("")+'<g class="seg"><circle cx="34" cy="28" r="9" fill="#a6e07f" stroke="#6fb24c"/><path d="M30 20q-2-6-6-6M37 20q1-6 5-6" stroke="#6fb24c" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="24" cy="14" r="1.8" fill="#6fb24c"/><circle cx="42" cy="14" r="1.8" fill="#6fb24c"/><circle cx="31" cy="27" r="1.8" fill="#5a3e2b"/><circle cx="38" cy="27" r="1.8" fill="#5a3e2b"/><path d="M32 32q2.5 2 5 0" stroke="#5a3e2b" stroke-width="1.2" fill="none" stroke-linecap="round"/><circle cx="28.5" cy="31" r="2" fill="#ffa8a0" opacity=".7"/></g>'},
dog:{n:"小狗",s:legs("#d9a066",14,27)+'<g class="bob"><path d="M8 26q-6-1-5-9" stroke="#e8b87a" stroke-width="3.5" stroke-linecap="round" fill="none"/><ellipse cx="20" cy="27" rx="13" ry="9" fill="#e8b87a"/><circle cx="32" cy="20" r="9" fill="#e8b87a"/><ellipse cx="27" cy="19" rx="3.5" ry="7" fill="#a9703a" transform="rotate(12 27 19)"/><ellipse cx="38.5" cy="23" rx="4.5" ry="3.5" fill="#fbe3c4"/><circle cx="42" cy="22" r="1.7" fill="#5a3e2b"/><circle cx="34" cy="18" r="1.9" fill="#5a3e2b"/><circle cx="33" cy="25" r="2.4" fill="#ffa8a0" opacity=".7"/></g>'},
cat:{n:"小貓",s:legs("#f0a04a",14,27)+'<g class="bob"><path d="M8 27q-7-1-4-12" stroke="#f0a04a" stroke-width="3.5" stroke-linecap="round" fill="none"/><ellipse cx="20" cy="27" rx="13" ry="9" fill="#f6b76a"/><path d="M14 20v5M19 19v5M24 20v5" stroke="#e08a3a" stroke-width="2" stroke-linecap="round"/><circle cx="32" cy="21" r="9" fill="#f6b76a"/><path d="M24.5 16L26 6l6 5zM33 11l6-5 1.5 10z" fill="#f6b76a"/><path d="M26.5 14l.8-4 2.6 2zM35 11l2.5-2.2.5 4z" fill="#ffb3b3"/><circle cx="29" cy="20" r="1.8" fill="#5a3e2b"/><circle cx="36.5" cy="20" r="1.8" fill="#5a3e2b"/><path d="M31.5 23.5h3l-1.5 1.8z" fill="#ff8f9f"/><path d="M39 24l4 1M39 26l4 2" stroke="#8a5a2a" stroke-width=".8"/><circle cx="27.5" cy="25" r="2" fill="#ff9d94" opacity=".6"/></g>'},
bunny:{n:"小兔",s:legs("#efe6da",14,27)+'<g class="bob" stroke="#e2d3c0" stroke-width="1"><circle cx="8" cy="27" r="3.5" fill="#fff"/><ellipse cx="20" cy="27" rx="13" ry="9" fill="#f7f1ea"/><circle cx="32" cy="21" r="9" fill="#f7f1ea"/><ellipse cx="29" cy="9" rx="3" ry="8" fill="#f7f1ea" transform="rotate(-8 29 9)"/><ellipse cx="36" cy="9" rx="3" ry="8" fill="#f7f1ea" transform="rotate(10 36 9)"/><ellipse cx="29" cy="9.5" rx="1.4" ry="5" fill="#ffc2cf" stroke="none" transform="rotate(-8 29 9)"/><ellipse cx="36" cy="9.5" rx="1.4" ry="5" fill="#ffc2cf" stroke="none" transform="rotate(10 36 9)"/><circle cx="29.5" cy="20" r="1.8" fill="#5a3e2b" stroke="none"/><circle cx="36.5" cy="20" r="1.8" fill="#5a3e2b" stroke="none"/><circle cx="33" cy="23.5" r="1.4" fill="#ff8f9f" stroke="none"/><circle cx="27" cy="25" r="2" fill="#ffb3b3" stroke="none" opacity=".7"/></g>'},
sloth:{n:"樹懶",s:legs("#9a7f60",14,27)+'<g class="bob"><ellipse cx="20" cy="27" rx="13" ry="9" fill="#b79a7a"/><circle cx="32" cy="21" r="9" fill="#e6d3b8"/><ellipse cx="29.5" cy="20" rx="3" ry="4.5" fill="#7a5f49" transform="rotate(20 29.5 20)"/><ellipse cx="36" cy="20" rx="3" ry="4.5" fill="#7a5f49" transform="rotate(-20 36 20)"/><circle cx="29.5" cy="20" r="1.3" fill="#fff"/><circle cx="36" cy="20" r="1.3" fill="#fff"/><ellipse cx="33" cy="25" rx="2" ry="1.4" fill="#5a3e2b"/><path d="M30.5 27.5q2.5 2 5 0" stroke="#5a3e2b" stroke-width="1.2" fill="none" stroke-linecap="round"/></g>'}};
function pet(){return PETS[S.pet]||PETS.chick}
function walker(){return '<svg class="chick" viewBox="0 0 44 44" aria-hidden="true">'+pet().s+'</svg>'}
function render(){
  var n=Date.now(),L=list(),f=focus(n,L);
  $("h1").textContent=S.title;
  if(!f){
    $("main").className="card";
    $("main").innerHTML='<span class="tag pk">考試</span><p class="nm" style="font-size:clamp(28px,5vw,56px)">還沒有考試科目</p><p>按下方「設定」新增科目吧！</p>';
    $("att").innerHTML='<span class="tag gn">出缺席</span><p>新增科目後就能點名。</p>';
    $("chips").innerHTML="";return;
  }
  var i=L.indexOf(f),d=(ms(f,"e")-ms(f,"s"))/6e4,mk=[[0,"🌱","出發"]];
  if(d>20)mk.push([(d-15)/d,"🌼","剩15分"]);
  if(d>10)mk.push([(d-5)/d,"🍎","剩5分"]);
  mk.push([1,"🏫","交卷"]);
  $("main").innerHTML='<span class="tag pk">第 '+(i+1)+' 科 / 共 '+L.length+' 科</span>'+
  '<div><b class="nm">'+esc(f.name)+'</b><span class="pill">'+hm(ms(f,"s"))+' – '+hm(ms(f,"e"))+'</span></div>'+
  '<div class="cd"><span id="cl"></span><span class="big" id="cv"></span><span class="adj"><button class="b s" data-a="ext" data-d="-5">－5 分</button><button class="b s" data-a="ext" data-d="5">＋5 分</button></span></div>'+
  '<div class="tl" id="tl"><div class="gr"></div>'+mk.map(function(k){return '<div class="mk" style="--q:'+k[0]+'"><span>'+k[1]+'</span><small>'+k[2]+'</small></div>'}).join("")+walker()+'</div>'+
  '<div class="tm"><span>'+hm(ms(f,"s"))+'</span><span id="pc"></span><span>'+hm(ms(f,"e"))+'</span></div>';
  var A=S.att[f.id]||{},m=marks(f.id),cls={"缺席":"a","請假":"l","遲到":"t"},grid="";
  for(var q=1;q<=S.n;q++)grid+='<button class="seat '+(cls[A[q]]||"")+'" data-a="seat" data-i="'+q+'">'+q+'</button>';
  var any=m["缺席"].length+m["請假"].length+m["遲到"].length;
  var ab=any?["缺席","請假","遲到"].filter(function(k){return m[k].length}).map(function(k){return '<div><b>'+k+'</b>　'+m[k].join("、")+'</div>'}).join(""):'<div>🎉 全班到齊！</div>';
  $("att").innerHTML='<span class="tag gn">出缺席・'+esc(f.name)+'</span>'+
  '<div class="two"><div class="stat bl"><small>應到</small><b>'+S.n+'<i>人</i></b></div><div class="stat gr2"><small>實到</small><b>'+(S.n-m["缺席"].length-m["請假"].length)+'<i>人</i></b></div></div>'+
  '<div class="ab">'+(roll?'<div class="seats">'+grid+'</div><p class="mut">點座號切換：出席 → 缺席 → 請假 → 遲到</p>':'<small>缺席座號</small>'+ab)+'</div>'+
  '<button class="b'+(roll?'':' g')+'" data-a="roll">'+(roll?'完成':'✏️ 點名／修改')+'</button>';
  var nx=L.find(function(e){return st(e,n)==="pre"});
  $("chips").innerHTML=L.map(function(e){var s=st(e,n),k=s==="run"?["rn","進行中"]:s==="end"?["en","已結束"]:e===nx?["nx","下一科"]:["pd","待考"];
    return '<button class="chip '+k[0]+(e===f?' foc':'')+'" data-a="pin" data-id="'+e.id+'"><b>'+esc(e.name)+'</b><span>'+hm(ms(e,"s"))+' – '+hm(ms(e,"e"))+'</span><em>'+k[1]+'</em></button>'}).join("");
}
function paint(n,f){
  if(!f)return;
  var s=ms(f,"s"),e=ms(f,"e"),t=st(f,n),p=t==="pre"?0:t==="end"?1:(n-s)/(e-s),rem=e-n;
  $("cl").textContent=t==="pre"?"距離考試開始還有":t==="run"?"考試剩餘時間":"考試結束，辛苦了！";
  $("cv").textContent=t==="pre"?cd(s-n):t==="run"?cd(rem):"";
  $("pc").textContent=Math.round(p*100)+"%";
  var tl=$("tl");tl.style.setProperty("--p",p);tl.classList.toggle("walk",t==="run");tl.classList.toggle("done",t==="end");
  $("main").className="card"+(t==="end"?" ok":t==="run"&&rem<=3e5?" bad":t==="run"&&rem<=9e5?" warn":"");
  $("msg").textContent=t==="end"?"時間到，放下筆囉！"+pet().n+"平安到學校，你們好棒 🎉":t==="run"&&rem<=9e5?"快到學校了，再檢查一下吧！":S.msg;
}
function tick(){
  var n=Date.now(),d=new Date(n),L=list(),f=focus(n,L);
  $("tm").textContent=hm(n)+":"+pad(d.getSeconds());
  $("dt").textContent=(d.getMonth()+1)+"月"+d.getDate()+"日　星期"+"日一二三四五六"[d.getDay()];
  var sig=(f?f.id:"")+L.map(function(e){var s=st(e,n),p=prev[e.id];
    if(S.snd&&((p==="pre"&&s==="run")||(p==="run"&&s==="end")))ding(s==="run"?[880,659]:[659,880,1047]);
    prev[e.id]=s;return s}).join("");
  if(sig!==lastSig){lastSig=sig;render()}
  paint(n,f);
}
function renderSet(){
  var rows=list().map(function(e){return '<div class="xr" data-id="'+e.id+'"><input data-f="name" value="'+esc(e.name)+'" aria-label="科目"><input type="date" data-f="date" value="'+esc(e.date||"")+'"><input type="time" data-f="start" value="'+esc(e.start||"")+'"><input type="time" data-f="end" value="'+esc(e.end||"")+'"><button class="b d" data-a="del">刪除</button></div>'}).join("");
  $("pn").innerHTML='<div class="sh"><h2>設定</h2><button class="b" data-a="close">完成</button></div>'+
  '<label>考試名稱<input data-k="title" value="'+esc(S.title)+'"></label>'+
  '<label>全班人數<input type="number" min="1" max="99" data-k="n" value="'+S.n+'"></label>'+
  '<label>提醒文字<input data-k="msg" value="'+esc(S.msg)+'"></label>'+
  '<label class="ck"><input type="checkbox" data-k="snd"'+(S.snd?' checked':'')+'> 考試開始與結束時播放鈴聲</label>'+
  '<h3>走路的小夥伴</h3><div class="pets">'+Object.keys(PETS).map(function(k){return '<button class="pt" data-a="pet" data-p="'+k+'" aria-pressed="'+((S.pet||"chick")===k)+'"><svg viewBox="0 0 44 44" width="44" height="44" aria-hidden="true">'+PETS[k].s+'</svg>'+PETS[k].n+'</button>'}).join("")+'</div>'+
  '<h3>考試科目（可直接修改）</h3>'+(rows||'<p class="mut">還沒有科目，請在下方新增。</p>')+
  '<h3>新增科目</h3><div class="row"><label>科目<input id="xn" placeholder="例：國語"></label><label>日期<input id="xd" type="date" value="'+today()+'"></label><label>開始<input id="xs" type="time" value="08:40"></label><label>結束<input id="xe" type="time" value="09:20"></label></div>'+
  '<p class="err" id="xerr"></p><button class="b" data-a="add">新增科目</button> <button class="b g" data-a="clr">清除目前這科的點名</button>';
}
document.addEventListener("click",function(ev){
  var b=ev.target.closest("[data-a]");if(!b)return;
  var a=b.dataset.a,f=focus(Date.now(),list());
  if(a==="set"){renderSet();$("set").hidden=false}
  else if(a==="close"){$("set").hidden=true}
  else if(a==="test"){ding([880,659])}
  else if(a==="fs"){try{var p=document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(function(){})}catch(e){}}
  else if(a==="pet"){S.pet=b.dataset.p;save();document.querySelectorAll(".pt").forEach(function(x){x.setAttribute("aria-pressed",x===b)});render();tick()}
  else if(a==="roll"){roll=!roll;render()}
  else if(a==="pin"){S.pin=S.pin===b.dataset.id?null:b.dataset.id;save();render()}
  else if(a==="seat"&&f){var A=S.att[f.id]||(S.att[f.id]={}),i=b.dataset.i,c=["缺席","請假","遲到"],k=c.indexOf(A[i]);if(k===2)delete A[i];else A[i]=c[k+1];save();render()}
  else if(a==="ext"&&f){var base=(ms(f,"e")-(f.ext||0)*6e4-ms(f,"s"))/6e4;f.ext=Math.max(5-base,(f.ext||0)+Number(b.dataset.d));save();render()}
  else if(a==="del"){
    if(!b.dataset.arm){b.dataset.arm=1;b.textContent="確定刪除？";setTimeout(function(){b.dataset.arm="";b.textContent="刪除"},3000);return}
    var id=b.closest("[data-id]").dataset.id;S.exams=S.exams.filter(function(e){return e.id!==id});delete S.att[id];if(S.pin===id)S.pin=null;save();renderSet();render();
  }else if(a==="add"){
    var v=function(i){return $(i).value};
    if(!v("xn").trim()||!v("xs")||!v("xe")){$("xerr").textContent="請輸入科目名稱、開始與結束時間。";return}
    S.exams.push({id:uid(),name:v("xn").trim(),date:v("xd")||today(),start:v("xs"),end:v("xe"),ext:0});save();renderSet();render();
  }else if(a==="clr"&&f){delete S.att[f.id];save();render()}
});
document.addEventListener("input",function(ev){
  var k=ev.target.dataset.k;
  if(k==="title"||k==="msg"){S[k]=ev.target.value;save();if(k==="title")$("h1").textContent=S.title}
});
document.addEventListener("change",function(ev){
  var t=ev.target,k=t.dataset.k,fl=t.dataset.f;
  if(k==="n"){S.n=Math.min(99,Math.max(1,parseInt(t.value,10)||1));t.value=S.n;save();render()}
  else if(k==="snd"){S.snd=t.checked;save()}
  else if(fl){var e=S.exams.find(function(x){return x.id===t.closest("[data-id]").dataset.id});if(e){e[fl]=t.value;save();render()}}
});
render();tick();setInterval(tick,250);
</script>
</body>
</html>
